name: Cherry++ Plugin API Change Monitor

on:
  push:
    branches: ['master']
    paths:
      - 'scintilla/include/Scintilla.h'
      - 'scintilla/include/Sci_Position.h'
      - 'PowerEditor/src/MISC/PluginsManager/Notepad_plus_msgs.h'
      - 'PowerEditor/src/MISC/PluginsManager/PluginInterface.h'
      - 'PowerEditor/src/menuCmdID.h'
      - 'PowerEditor/src/WinControls/DockingWnd/Docking.h'
      - 'PowerEditor/src/WinControls/DockingWnd/dockingResource.h'
  workflow_dispatch:

jobs:
  plugin-api-change-monitor:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Report compatibility-sensitive changes
        shell: pwsh
        run: |
          $watchFiles = @(
            "scintilla/include/Scintilla.h",
            "scintilla/include/Sci_Position.h",
            "PowerEditor/src/MISC/PluginsManager/Notepad_plus_msgs.h",
            "PowerEditor/src/MISC/PluginsManager/PluginInterface.h",
            "PowerEditor/src/menuCmdID.h",
            "PowerEditor/src/WinControls/DockingWnd/Docking.h",
            "PowerEditor/src/WinControls/DockingWnd/dockingResource.h"
          )

          $changedFiles = @(git diff --name-only HEAD~1..HEAD)
          $sensitiveChanges = @($changedFiles | Where-Object { $_ -in $watchFiles })

          if ($sensitiveChanges.Count -eq 0) {
            Write-Output "No Cherry++ plugin compatibility files changed in the latest commit."
            exit 0
          }

          Write-Output "Cherry++ plugin compatibility-sensitive files changed:"
          $sensitiveChanges | ForEach-Object { Write-Output " - $_" }
          Write-Output "Review the existing Notepad++ plugin API compatibility boundary before release."
          Write-Output "No external repositories are notified or modified by this workflow."
